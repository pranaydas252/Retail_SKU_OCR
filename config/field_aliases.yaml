# Field label aliases and value formats.
#
# CLAUDE.md section 8: these are starting rules, kept configurable and easy to
# extend. Add aliases here, never in code.
#
# Matching is case-insensitive and ignores punctuation and spacing, so "B.NO."
# "b no" and "BNO" all collapse to the same key. Longer aliases are tried
# first, so "BATCH NO" wins over "BATCH" on the same token.
#
# value_type drives both normalization and the plausibility gate that stops a
# label from grabbing an implausible neighbour:
#   date      -> must parse as a date
#   currency  -> must contain a number
#   code      -> must be alphanumeric, and must not itself look like a label

fields:
  # Read from the pack's barcode by the device, never from the printed text.
  #
  # The empty alias list is deliberate and load bearing. A spec here gives the
  # field a value type, so an operator-confirmed SKU normalizes and persists
  # like any other field instead of being stored as an unrecognized string. But
  # with no aliases the label matcher can never match it, so the extractor
  # cannot invent an SKU from something that happens to sit near the word "SKU"
  # on the packaging. The barcode is the only source.
  skuCode:
    value_type: code
    aliases: []

  batchNumber:
    value_type: code
    aliases:
      - BATCH NUMBER
      - BATCH NO.
      - BATCH NO
      - BATCH
      - B.NO.
      - B.NO
      - BNO
      - BN

  manufacturingDate:
    value_type: date
    date_precision: month   # month/year is the common printing on SKU labels
    aliases:
      - MANUFACTURING DATE
      - MANUFACTURED ON
      - MANUFACTURING
      - MANUFACTURED
      - MFG DATE
      - MFD DATE
      - MFG.DATE
      # Packed and manufactured are the same field for this purpose: a pack
      # states one or the other, never both, and expiry is derived from
      # whichever it prints. "Date of Packaging" is on a real capture in the
      # corpus and matched nothing, because matching is exact-or-prefix and
      # that phrase does not begin with PACKED.
      - DATE OF PACKAGING
      - DATE OF PACKING
      - PACKAGING DATE
      - PACKAGED ON
      - PACKING DATE
      - PACKED ON
      - PACKED
      - PKD DATE
      - PKD ON
      # "Date of ..." phrasings. Matching is exact-or-prefix, so a token
      # reading "Date of Mfg:" is NOT matched by the MFG alias below -- MFG is
      # not a prefix of DATEOFMFG. This is the same miss that DATE OF PACKAGING
      # above was added to fix, on a different phrasing, and it cost the MFG
      # field on SCAN-000487/488 (both engines): the label matched nothing, so
      # the date was recovered by the "earlier of two printed dates" fallback
      # at half the label and spatial quality.
      - DATE OF MANUFACTURE
      - DATE OF MANUFACTURING
      - DATE OF MFG
      - DATE OF MFD
      - MFG ON
      - MFD ON
      - MFG
      - MFD
      - PKD

  expiryDate:
    value_type: date
    date_precision: month
    aliases:
      - EXPIRY DATE
      - EXPIRY
      - EXP DATE
      - EXPIRES ON
      - EXPIRES
      - USE BEFORE
      - BEST BEFORE
      - USE BY
      # See the "Date of ..." note under manufacturingDate.
      - DATE OF EXPIRY
      - DATE OF EXPIRATION
      - EXP

  lotCode:
    value_type: code
    aliases:
      - LOT NUMBER
      - LOT CODE
      - LOT NO.
      - LOT NO
      - LOT

  mrp:
    value_type: currency
    aliases:
      - MAXIMUM RETAIL PRICE
      - MAX RETAIL PRICE
      - M.R.P.
      - M.R.P
      - MRP

# Confidence weighting (CLAUDE.md section 12).
#
# These are engineering defaults, not calibrated probabilities. They must be
# tuned against real D-Mart label images before anyone treats the number as
# meaningful. Weights are normalized at load, so they need not sum to 1.
confidence_weights:
  ocr: 0.40           # recognition confidence of the value token
  label_match: 0.20   # exact alias hit vs. a looser match
  spatial: 0.20       # same-line beats below; near beats far
  format: 0.15        # value normalized cleanly for its type
  consistency: 0.05   # cross-field agreement, e.g. mfg < exp

# Penalty applied to a date resolved under a stated convention rather than an
# unambiguous one. See normalizer.py.
#
# Was 0.25, and measurement on the 20-image corpus said that was backwards.
# Of the dates carrying this flag, 11 of 11 were CORRECT; the single wrong date
# in the corpus was NOT flagged. The flag is anti-correlated with error here,
# because the conventions it marks are real domain rules rather than guesses:
# Indian retail prints day-first, of two stamped dates the earlier is
# manufacture, and a lone stamped date is manufacture. Applying them is knowing
# something, not assuming something.
#
# A 25% cut was therefore charged almost exclusively to values that were right,
# which is what put a correct scan on screen under four "Low confidence"
# warnings. An operator warned on every scan stops reading warnings, and then
# the band says nothing on the scan that genuinely is wrong.
#
# Not zero. The conventions are strong, not certain — a pack printing MM/DD
# would still be read day-first — and the note stays attached to the field
# either way, so the operator can see which rule was applied.
#
# Sample is 17 dates. Revisit when the corpus grows.
ambiguous_date_penalty: 0.05

# Two-engine agreement, when the VLM runs alongside PP-OCRv5. See ensemble.py.
#
# Measured on the earlier corpus: 23 of 50 values were answered by exactly one
# of the two engines, and merging only where they agreed gave 2 wrong values
# against 14 for a naive union. Agreement is therefore worth more than either
# engine's own confidence, and disagreement is worth more than either engine's
# doubt.
#
# The bonus closes a fraction of the remaining gap to 1.0 rather than adding a
# fixed amount, so corroboration cannot carry a field that every other signal
# rates poorly. Both are engineering defaults and must be tuned once the new
# corpus exists — they have never been measured.
engine_agreement_bonus: 0.15
engine_conflict_penalty: 0.35
